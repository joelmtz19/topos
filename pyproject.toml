[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "topos"
version = "0.1.0"
description = "Una capa topológica sobre Linux: archivos en complejos simpliciales, permisos como haz, procesos como caminos"
requires-python = ">=3.10"

[project.optional-dependencies]
fuse = ["fusepy>=3.0"]
test = ["pytest>=8"]

[project.scripts]
topos = "topos.cli:main"

[tool.setuptools]
packages = ["topos"]
