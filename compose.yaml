# topOS en Docker: el sistema y su modelo abierto / topOS in Docker: the system and its open model.
#
#   docker compose up -d --build        levanta todo / start everything (first run pulls the model)
#   docker compose exec topos bash -l   entra a topOS / get a topOS shell
#   docker compose exec topos topos-demo-agents
#
# El mundo, la bitácora y los modelos viven en volúmenes: sobreviven a `down`.
# The world, the log and the models live in volumes: they survive `down`.
#
#   TOPOS_LANG=es docker compose up -d                                   en español
#   TOPOS_OLLAMA=http://host.docker.internal:11434 docker compose up -d topos
#                                         usa el Ollama de tu máquina / use your host's Ollama

services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama-modelos:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      retries: 30

  topos:
    build:
      context: .
      dockerfile: distro/Dockerfile
      target: base
    image: topos-os
    hostname: topOS
    restart: unless-stopped
    command: ["topos-service"]
    environment:
      TOPOS_OLLAMA: ${TOPOS_OLLAMA:-http://ollama:11434}
      TOPOS_MODEL: ${TOPOS_MODEL:-qwen3:4b}
      TOPOS_LANG: ${TOPOS_LANG:-}
      # Los agentes sólo salen a la red por este proxy / agents only reach the network through it
      TOPOS_PROXY: http://127.0.0.1:3128
    devices:
      - /dev/fuse
    cap_add:
      - SYS_ADMIN
      - NET_ADMIN
    security_opt:
      - apparmor:unconfined
    volumes:
      - topos-mundo:/home/topos/.mundo
      - topos-bitacora:/var/log/topos
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "topos", "sched", "status"]
      interval: 10s
      retries: 10

# Los nombres de los volúmenes no cambian: renombrarlos perdería los datos existentes.
# Volume names stay as they are: renaming them would orphan existing data.
volumes:
  ollama-modelos:
  topos-mundo:
  topos-bitacora:
