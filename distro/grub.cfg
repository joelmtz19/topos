set timeout=4
set default=0
serial --unit=0 --speed=115200
terminal_input console serial
terminal_output console serial
set menu_color_normal=light-cyan/black
set menu_color_highlight=black/light-magenta

menuentry "topOS 0.1 Betti - un sistema operativo topologico" {
    linux /live/vmlinuz boot=live components quiet console=ttyS0,115200 console=tty0
    initrd /live/initrd.img
}
menuentry "topOS 0.1 - arranque detallado" {
    linux /live/vmlinuz boot=live components console=ttyS0,115200 console=tty0
    initrd /live/initrd.img
}
